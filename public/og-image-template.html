<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Image Open Graph - Leave Tracker</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 1200px;
            height: 630px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .logo {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 32px;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .description {
            font-size: 24px;
            max-width: 800px;
            line-height: 1.4;
            opacity: 0.8;
        }
        .icon {
            font-size: 100px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📅</div>
        <div class="logo">Leave Tracker</div>
        <div class="subtitle">Gestionnaire de Congés</div>
        <div class="description">
            Application de gestion des congés et des absences pour les employés.<br>
            Suivez vos jours de congé, demandez des absences et consultez votre historique.
        </div>
    </div>
</body>
</html>
