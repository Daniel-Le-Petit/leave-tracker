<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="30" cy="30" r="25" fill="url(#gradient)" opacity="0.1"/>
  
  <!-- Main text -->
  <text x="30" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">Retraite</text>
  <text x="30" y="42" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Clair</text>
  
  <!-- Subtitle -->
  <text x="80" y="35" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Simulateur de retraite progressive</text>
</svg>